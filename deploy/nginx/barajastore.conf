# ================================================================
# NGINX Configuration for Baraja Purchasing Management System
# Frontend Web : barajastore.my.id       -> 127.0.0.1:3000
# Backend API  : api.barajastore.my.id   -> 127.0.0.1:5000
# ================================================================

# 1. FRONTEND: barajastore.my.id
server {
    listen 80;
    listen [::]:80;
    server_name barajastore.my.id;

    # Maximum file upload size
    client_max_body_size 30M;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # Next.js Static Cache Optimization
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}

# 2. BACKEND API: api.barajastore.my.id
server {
    listen 80;
    listen [::]:80;
    server_name api.barajastore.my.id;

    # Allow larger payload for receipt images & documents
    client_max_body_size 30M;

    # Gzip Compression
    gzip on;
    gzip_types application/json text/plain;

    # WebSocket support for Socket.io / real-time updates
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Proxy
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}
