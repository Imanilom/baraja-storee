services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: baraja_api
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:-mongodb+srv://rcooker00_db_user:0Mkh0swiymyFu2Ti@baraja-store.d9rjswq.mongodb.net/purchasing_management?retryWrites=true&w=majority}
      JWT_SECRET: ${JWT_SECRET:-purchasing_secret_jwt_key_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-purchasing_refresh_secret_key_2026}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-30d}
      BARAJA_STORE_BASE_URL: https://app.barajacoffee.site
      BARAJA_STORE_OAUTH_CLIENT_ID: baraja-store-client-id
      BARAJA_STORE_OAUTH_CLIENT_SECRET: JiLcYhCVxdkHK4V/6gFC7gUhsxi8h7pXkbwXpSD0zCA=
      BARAJA_STORE_OAUTH_TOKEN_SECRET: j9lUz73prZX9bq0L3qNBIojiM/RtR15jkw7ImWMU/Jc=
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - baraja_net

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: https://api.barajastore.my.id/api/v1
    container_name: baraja_web
    restart: always
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.barajastore.my.id/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    networks:
      - baraja_net

networks:
  baraja_net:
    driver: bridge

