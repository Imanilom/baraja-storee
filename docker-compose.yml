services:
  mongodb:
    image: mongo:7.0
    container_name: purchasing_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: purchasing_management
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: test $$(mongosh --quiet --eval "try { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok } catch(e) { rs.status().ok }") -eq 1
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s

volumes:
  mongodb_data:

